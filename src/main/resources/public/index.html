<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HanziToAnki - Flashcard Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .form-section {
            margin-bottom: 25px;
        }

        .form-section label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-section input[type="file"],
        .form-section select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-section input[type="file"]:hover,
        .form-section select:hover {
            border-color: #667eea;
        }

        .form-section input[type="file"]:focus,
        .form-section select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: #f5f5f5;
            border: 2px dashed #ddd;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
        }

        .file-input-label:hover {
            border-color: #667eea;
            background: #fafafa;
            color: #667eea;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-column {
            display: flex;
            flex-direction: column;
        }

        .option-column label {
            margin-bottom: 6px;
            font-size: 13px;
        }

        .option-column select {
            padding: 8px;
            font-size: 13px;
        }

        .form-section.full-width {
            grid-column: 1 / -1;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .info-text {
            color: #666;
            font-size: 12px;
            margin-top: 6px;
        }

        .description {
            color: #999;
            font-size: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .file-name {
            color: #667eea;
            font-size: 13px;
            margin-top: 5px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>HanziToAnki</h1>
            <p>Generate flashcards from Chinese text</p>
        </div>

        <form method="POST" action="/generate" enctype="multipart/form-data" id="generateForm">
            <!-- File Upload -->
            <div class="form-section">
                <label for="uploadFile">Upload Chinese Text</label>
                <div class="file-input-wrapper">
                    <input type="file" id="uploadFile" name="uploadFile" accept=".txt" required>
                    <label for="uploadFile" class="file-input-label">
                        Click to select a .txt file<br>
                        <span class="info-text">or drag and drop</span>
                    </label>
                </div>
                <div class="file-name" id="fileName"></div>
            </div>

            <!-- Options Grid -->
            <div class="options-grid">
                <!-- Hanzi Type -->
                <div class="form-section">
                    <label for="hanziType">Character Type</label>
                    <select id="hanziType" name="hanziType" required>
                        <option value="SIMP">Simplified (简体)</option>
                        <option value="TRAD">Traditional (繁體)</option>
                        <option value="SIMP_AND_TRAD">Both (混合)</option>
                    </select>
                </div>

                <!-- Strategy -->
                <div class="form-section">
                    <label for="strategy">Segmentation Strategy</label>
                    <select id="strategy" name="strategy" required>
                        <option value="0">Balanced (Default)</option>
                        <option value="1">All Combinations</option>
                        <option value="4">Single Characters Only</option>
                        <option value="2">Bigram + Monogram (No Overlap)</option>
                        <option value="3">Bigram + Monogram (Overlap)</option>
                    </select>
                </div>

                <!-- HSK Level -->
                <div class="form-section">
                    <label for="hskLevel">Minimum HSK Level</label>
                    <select id="hskLevel" name="hskLevel" required>
                        <option value="0">Include All (0)</option>
                        <option value="1">Exclude HSK 1</option>
                        <option value="2">Exclude HSK 1-2</option>
                        <option value="3">Exclude HSK 1-3</option>
                        <option value="4">Exclude HSK 1-4</option>
                        <option value="5">Exclude HSK 1-5</option>
                        <option value="6">Exclude HSK 1-6</option>
                    </select>
                </div>

                <!-- Format -->
                <div class="form-section">
                    <label for="format">Output Format</label>
                    <select id="format" name="format" required>
                        <option value="ANKI">Anki TSV</option>
                        <option value="PLECO">Pleco</option>
                        <option value="MEMRISE">Memrise</option>
                    </select>
                </div>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" class="btn-submit">Generate Flashcards</button>
                <button type="reset" class="btn-reset">Clear</button>
            </div>

            <div class="description">
                Upload a UTF-8 encoded .txt file with Chinese text. The tool will extract vocabulary and generate flashcards
                with definitions and pinyin pronunciation. Compatible with Anki, Pleco, and Memrise.
            </div>
        </form>
    </div>

    <script>
        // File input display
        document.getElementById('uploadFile').addEventListener('change', function() {
            const fileName = this.files[0]?.name || '';
            document.getElementById('fileName').textContent = fileName ? '📄 ' + fileName : '';
        });

        // Drag and drop
        const fileInput = document.getElementById('uploadFile');
        const fileLabel = document.querySelector('.file-input-label');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            fileLabel.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            fileLabel.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            fileLabel.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            fileLabel.style.borderColor = '#667eea';
            fileLabel.style.background = '#f0f4ff';
        }

        function unhighlight(e) {
            fileLabel.style.borderColor = '#ddd';
            fileLabel.style.background = '#fafafa';
        }

        fileLabel.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files;
            
            // Trigger change event
            const event = new Event('change', { bubbles: true });
            fileInput.dispatchEvent(event);
        }
    </script>
</body>
</html>
