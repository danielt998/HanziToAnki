plugins {
    id 'java'
    id 'application'
    id 'idea'
    id 'org.springframework.boot' version '3.4.0'
}

group 'org.example'
version '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.tika:tika-core:2.9.2'
    implementation 'org.jetbrains:annotations:26.0.1'
    
    // Spring Boot 3.4+
    implementation 'org.springframework.boot:spring-boot-starter-web:3.4.0'
    
    // SLF4J API for application code
    implementation 'org.slf4j:slf4j-api:2.0.16'
    
    // ANSJ for Chinese word segmentation (Jieba-like algorithms)
    implementation 'org.ansj:ansj_seg:5.1.6'
    
    // PDFBox for PDF generation (flashcards)
    implementation 'org.apache.pdfbox:pdfbox:3.0.4'
    
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

application {
    mainClass = 'Launcher'
}

sourceSets {
    main {
        java {
            exclude 'GUIs/**'
        }
    }
    test {
        java {
            exclude '**/GeneratorControllerTest.java'
        }
    }
}

compileJava {
    options.encoding = "UTF-8"
    options.release = 25
}

compileTestJava {
    options.encoding = "UTF-8"
    options.release = 25
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.register('printClasspath') {
    doLast {
        println configurations.runtimeClasspath.asPath
    }
}

tasks.register('runApi') {
    description = "Run the Spring Boot API server"
    dependsOn 'classes'
    doLast {
        javaexec {
            classpath = sourceSets.main.runtimeClasspath
            mainClass = 'server.Application'
        }
    }
}

tasks.register('runCli') {
    description = "Run the CLI tool (usage: ./gradlew runCli -Pargs='input.txt')"
    dependsOn 'classes'
    doLast {
        def cliArgs = project.hasProperty('args') ? project.args.toString().split('\\s+') as List : []
        javaexec {
            classpath = sourceSets.main.runtimeClasspath
            mainClass = 'hanziToAnki.Main'
            args = cliArgs
        }
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('cliJar', Jar) {
    description = "Create a standalone CLI JAR (without Spring Boot)"
    archiveBaseName.set("HanziToAnki-cli")
    from sourceSets.main.output
    exclude 'server/**'
    exclude 'public/**'
    manifest {
        attributes 'Main-Class': 'hanziToAnki.Main'
    }
    dependsOn classes
}

tasks.register('apiJar', Jar) {
    description = "Create a standalone API JAR (without CLI Main)"
    archiveBaseName.set("HanziToAnki-api")
    from sourceSets.main.output
    exclude 'hanziToAnki/Main.class'
    manifest {
        attributes 'Main-Class': 'server.Application'
    }
    dependsOn classes
}
